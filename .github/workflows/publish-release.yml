name: Publish release snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact update
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Package the version snapshot
        id: snapshot
        shell: bash
        run: |
          commit_time="$(git show -s --format=%cI "$GITHUB_SHA")"
          stamp="$(date -u -d "$commit_time" +%Y%m%d-%H%M%S)"
          short_sha="${GITHUB_SHA:0:8}"
          tag="snapshot-$stamp-$short_sha"
          version="$(node -p "require('./package.json').version")"
          printf 'tag=%s\ntitle=纸间 · Leaf %s · %s\n' "$tag" "$version" "$stamp" >> "$GITHUB_OUTPUT"

          mkdir -p release
          (
            cd .cloudflare/output/v1/workers/default/assets
            zip -qr "$GITHUB_WORKSPACE/release/leaf-web-$tag.zip" .
          )
          (
            cd release
            sha256sum *.zip > SHA256SUMS
          )

          previous_tag="$(git describe --tags --match 'snapshot-*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          revision="$GITHUB_SHA"
          if [[ -n "$previous_tag" ]]; then
            revision="$previous_tag..$GITHUB_SHA"
          fi
          {
            printf '## 纸间 · Leaf %s\n\n' "$version"
            printf '[在线使用](https://docreader.fkonline.workers.dev/) · [对应提交](https://github.com/%s/commit/%s)\n\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '### 本次更新\n\n'
            git log "$revision" --format='- %s (%h)'
            printf '\n### 版本快照\n\n'
            printf -- '- `leaf-web-*.zip`：已构建的网页文件，可部署到静态网站服务的根目录。\n'
            printf -- '- `Source code`：此版本的完整源码快照。\n'
            printf -- '- `SHA256SUMS`：网页压缩包的校验值。\n'
          } > release/notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.snapshot.outputs.tag }}
          RELEASE_TITLE: ${{ steps.snapshot.outputs.title }}
        shell: bash
        run: |
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" == 'false' ]]; then
            printf 'Snapshot already published: %s\n' "$RELEASE_TAG"
            exit 0
          fi

          if [[ "$draft" != 'true' ]]; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release/notes.md \
              --draft
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/SHA256SUMS --clobber

          latest=false
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]; then
            latest=true
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
          printf 'Published https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
